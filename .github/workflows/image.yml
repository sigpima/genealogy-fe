# Mỗi lần push lên main: test -> build -> đẩy ghcr.io/<owner>/<repo> (genealogy-fe) với hai tag: latest và sha-<7 ký tự>.
# Test phải xanh mới được publish: main hỏng không được phép thành `latest`.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false    # không bao giờ huỷ job đang publish giữa chừng

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22      # khớp Dockerfile
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run

  image:
    needs: [test]
    runs-on: ubuntu-latest      # amd64, khớp server
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}     # tự viết thường
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}      # gắn package với repo
          # Đóng băng vào image lúc `next build` (rewrites); phải khớp tên service "api" trong docker-compose.
          build-args: |
            API_BASE_URL=http://api:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Tóm tắt
        run: |
          {
            echo "### Image đã đẩy"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Triển khai: trên server chạy \`./update.sh\` (hoặc \`WEB_IMAGE_TAG=sha-${GITHUB_SHA::7} ./update.sh\` cho đúng bản build này)."
          } >> "$GITHUB_STEP_SUMMARY"
